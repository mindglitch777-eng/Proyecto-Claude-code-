name: investigar-voz

# Investiga Y MIDE motores de voz DESDE EL RUNNER, que tiene internet
# completo -- no desde la sesion de Claude Code (medio internet
# bloqueado, y cada busqueda ahi gasta tiempo de sesion sin necesidad).
#
# Dos resultados en INVESTIGACION_VOZ.md:
#   1. Repos de GitHub / modelos de HuggingFace / hilos de Reddit,
#      todo con links citables -- para calidad y reputacion.
#   2. Benchmark REAL: la MISMA frase de nuestro guion, generada por
#      cada motor liviano, EN ESTE RUNNER. No es un numero de un blog
#      con otro hardware, es el tiempo real que vamos a tener.
#
# No incluye Chatterbox: ya se midio en voz-librivox.yml y es lento en
# CPU (modelo de ~500M parametros). Este workflow busca alternativas
# MAS RAPIDAS.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /opt/az 2>/dev/null || true

      - name: Instalar motores livianos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install --quiet --no-cache-dir soundfile numpy
          pip install --quiet --no-cache-dir "kokoro>=0.9" || echo "AVISO: kokoro no instalo"
          pip install --quiet --no-cache-dir piper-tts || echo "AVISO: piper no instalo"
          pip install --quiet --no-cache-dir melotts || pip install --quiet --no-cache-dir "MeloTTS @ git+https://github.com/myshell-ai/MeloTTS.git" || echo "AVISO: melo no instalo"
          pip install --quiet --no-cache-dir pocket-tts || echo "AVISO: pocket no instalo"

      - name: Investigar y medir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 investigar_tts.py

      - name: Guardar reporte
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          rm -f bench-*.wav
          if [ -n "$(git status --porcelain INVESTIGACION_VOZ.md)" ]; then
            git add INVESTIGACION_VOZ.md
            git commit -m "Investigacion + benchmark real de motores de voz"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios."
          fi
