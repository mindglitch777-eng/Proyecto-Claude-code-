name: marcar-subido-por-issue

# Reemplaza a la Netlify Function + secreto (2026-09-15, el panel se
# movio a GitHub Pages). El boton "Ya lo subi" del panel ahora es un
# link que abre un Issue prellenado ("Ya subido: <id>") -- no hace
# falta ningun secreto nuevo, el operador ya esta logueado en GitHub.
# Este workflow marca la entrada real como subida, regenera el panel,
# lo empuja a main (dispara publicar-panel-pages.yml) y cierra el issue.
#
# Filtro de seguridad: el repo es publico desde 2026-09-15, asi que
# cualquiera podria abrir un issue con este titulo -- solo se procesa
# si lo abrio el propio operador.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  RAMA_TRABAJO: claude/organize-repo-duplicates-xl042t

jobs:
  marcar:
    if: startsWith(github.event.issue.title, 'Ya subido:') && github.event.issue.user.login == 'mindglitch777-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMA_TRABAJO }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Traer el estado real de main
        run: |
          git fetch origin main
          git checkout origin/main -- state/uploads.json state/carruseles.json

      - name: Marcar como subido
        id: marcar
        run: |
          ID=$(echo "${{ github.event.issue.title }}" | sed -E 's/^Ya subido:[[:space:]]*//')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const id = process.argv[1];
            let encontrado = false;
            for (const archivo of ["state/uploads.json", "state/carruseles.json"]) {
              const datos = JSON.parse(fs.readFileSync(archivo, "utf-8"));
              const entrada = datos.find((e) => e.id === id);
              if (entrada) {
                entrada.estado = "subido";
                entrada.subidoEn = new Date().toISOString();
                fs.writeFileSync(archivo, JSON.stringify(datos, null, 2) + "\n");
                console.log("Marcado en " + archivo);
                encontrado = true;
              }
            }
            if (!encontrado) { console.error("No se encontro id " + id); process.exit(1); }
          ' "$ID"

      - name: Regenerar panel
        working-directory: fabrica
        run: npx tsx subida/generar_panel.ts

      - name: Empujar a main
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          cp state/uploads.json /tmp/uploads.json
          cp state/carruseles.json /tmp/carruseles.json
          cp panel/torre-de-control.html /tmp/panel.html
          for i in 1 2 3 4 5 6; do
            git checkout -B sync-main origin/main
            cp /tmp/uploads.json state/uploads.json
            cp /tmp/carruseles.json state/carruseles.json
            cp /tmp/panel.html panel/torre-de-control.html
            git add state/uploads.json state/carruseles.json panel/torre-de-control.html
            if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
            git commit -m "Marcar subido: ${{ steps.marcar.outputs.id }} (issue #${{ github.event.issue.number }})"
            if git push origin sync-main:main; then exit 0; fi
            git fetch origin main
            sleep $((RANDOM % 5 + 2 * i))
          done
          echo "::error::No se pudo empujar a main tras varios intentos (carrera de git)"
          exit 1

      - name: Cerrar el issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "Marcado como subido (${{ steps.marcar.outputs.id }}). El panel ya se actualizó."
