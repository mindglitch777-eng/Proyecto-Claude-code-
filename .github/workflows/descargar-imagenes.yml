name: descargar-imagenes

# Corre descargar_imagenes.py con red abierta (el sandbox de Claude Code
# bloquea Wikimedia/Openverse). Solo lee de fuentes publicas con licencia
# libre (CC0/PD/CC-BY) y registra la atribucion en assets/LICENCIAS.txt.
# No gasta dinero, no publica nada, no manda mensajes a terceros.

on:
  workflow_dispatch:
    inputs:
      lote:
        description: "Ruta al JSON de lote a descargar"
        required: false
        default: "lote-imagenes-historicas.json"

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar imagenes del lote
        run: python3 descargar_imagenes.py --lote "${{ inputs.lote }}"

      - name: Commitear imagenes y licencias
        if: always()
        run: |
          git config user.name "descargador-bot"
          git config user.email "actions@github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "Descarga automatica de imagenes (${{ inputs.lote }})"
          git push
