name: voz-librivox

# Busca candidatos de voz masculina en LibriVox (audiolibros de
# dominio publico) y clona cada uno con Chatterbox diciendo nuestra
# frase de guion, para elegir de oido.
#
# Corre aca porque librivox.org, archive.org y huggingface.co (donde
# vive el modelo de Chatterbox) estan bloqueados desde el entorno de
# Claude Code, y clonar con Chatterbox en CPU tarda -- no tiene sentido
# gastar minutos de la sesion esperando.

on:
  workflow_dispatch:
    inputs:
      cuantos:
        description: "Cuantos candidatos de voz buscar"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Liberar espacio en disco
        run: |
          # El runner trae preinstalado Android SDK, .NET, GHC, etc.
          # que no usamos y ocupan ~25 GB. torch + chatterbox-tts
          # (con sus dependencias) necesitan mas espacio del que queda
          # libre por defecto: la instalacion murio con "No space left
          # on device" a mitad de la corrida anterior.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /opt/az 2>/dev/null || true
          df -h /

      - name: Instalar ffmpeg y Chatterbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --no-cache-dir chatterbox-tts

      - name: Buscar candidatos y clonar
        env:
          CUANTOS: ${{ inputs.cuantos }}
        run: python3 conseguir_voz_librivox.py "$CUANTOS"

      - name: Guardar
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain assets/voz_referencia muestras_voz)" ]; then
            git add assets/voz_referencia muestras_voz
            git commit -m "Candidatos de voz masculina desde LibriVox + clon con Chatterbox"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios."
          fi
