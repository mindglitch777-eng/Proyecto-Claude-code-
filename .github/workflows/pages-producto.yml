name: pages-producto

# Publica producto/el-corte-v7.html como GitHub Pages (como index.html
# en la raiz del sitio publicado). No corre solo: se dispara a mano o
# cuando cambia el archivo del producto en main.
#
# Importante: esta URL no se reparte directo al comprador. Va a quedar
# enlazada adentro del Area de Membros de Hotmart, detras de su login
# (ver marca/ficha-venta.md).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "producto/el-corte-v7.html"
      - ".github/workflows/pages-producto.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar carpeta de publicacion
        run: |
          mkdir -p _site
          cp producto/el-corte-v7.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
