name: investigar-musica-fabrica

# Busca candidatos reales de musica libre de derechos para la Nueva
# Fabrica (fabrica/musica/), sin usar ningun servicio pago. Corre en
# GitHub Actions porque Free Music Archive y Jamendo estan bloqueados
# desde el sandbox de Claude Code (mismo motivo que Qwen3-TTS con
# huggingface.co). NO descarga ni compromete ningun track -- solo
# investiga y documenta candidatos con su licencia para que el
# operador escuche y decida cuales agregar de verdad a
# fabrica/musica/biblioteca.json.
#
# Jamendo necesita un client_id gratis (registrarse sin costo en
# developer.jamendo.com) guardado como secret JAMENDO_CLIENT_ID -- si
# no esta configurado, esta seccion queda vacia con el motivo explicado,
# no se inventa nada.

on:
  workflow_dispatch:
    inputs:
      busqueda:
        description: "Termino de busqueda (mood/genero)"
        required: false
        default: "motivational upbeat corporate hustle"
  # Mismo truco que prueba-normalizacion-qwen3-tts.yml: workflow_dispatch
  # por API solo funciona desde la rama por defecto, pero un evento
  # `push` lee el workflow de la rama que recibio el push. `paths`
  # apunta a este mismo archivo para que el commit de resultados (que
  # solo toca fabrica/musica/CANDIDATOS.md) no dispare un loop.
  push:
    branches: ["claude/organize-repo-duplicates-xl042t"]
    paths: [".github/workflows/investigar-musica-fabrica.yml"]

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Buscar en Free Music Archive y Jamendo
        env:
          BUSQUEDA: ${{ inputs.busqueda || 'motivational upbeat corporate hustle' }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          UA = {"User-Agent": "Mozilla/5.0 (compatible; FabricaContenido-Investigacion/1.0)"}
          busqueda = os.environ.get("BUSQUEDA", "motivational upbeat corporate hustle")
          jamendo_id = os.environ.get("JAMENDO_CLIENT_ID", "")

          def get_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          secciones = []

          # Free Music Archive: API v2 publica, sin clave.
          try:
              url = "https://freemusicarchive.org/api/get/tracks.json?" + urllib.parse.urlencode(
                  {"q": busqueda, "limit": 15})
              datos = get_json(url)
              items = []
              for t in (datos.get("dataset") or datos.get("aTracks") or []):
                  if not isinstance(t, dict):
                      continue
                  items.append({
                      "titulo": t.get("track_title", "?"), "artista": t.get("artist_name", "?"),
                      "licencia": t.get("license_title", "?"), "url": t.get("track_url", ""),
                  })
              secciones.append(("Free Music Archive", items, None))
          except Exception as e:
              secciones.append(("Free Music Archive", [], str(e)))

          time.sleep(1)

          # Jamendo: API publica, necesita client_id gratis.
          if jamendo_id:
              try:
                  params = {"client_id": jamendo_id, "format": "json", "limit": 15,
                            "search": busqueda, "include": "musicinfo",
                            "audioformat": "mp32", "order": "popularity_total"}
                  url = "https://api.jamendo.com/v3.0/tracks/?" + urllib.parse.urlencode(params)
                  datos = get_json(url)
                  items = []
                  for t in datos.get("results", []):
                      items.append({
                          "titulo": t.get("name", "?"), "artista": t.get("artist_name", "?"),
                          "duracion_s": t.get("duration", 0),
                          "licencia": t.get("license_ccurl", "ver pagina"),
                          "url": t.get("shareurl", ""), "descarga": t.get("audiodownload", ""),
                      })
                  secciones.append(("Jamendo", items, None))
              except Exception as e:
                  secciones.append(("Jamendo", [], str(e)))
          else:
              secciones.append(("Jamendo", [], "sin JAMENDO_CLIENT_ID configurado como secret del repo "
                                                "-- registrarse gratis en developer.jamendo.com si se quiere "
                                                "sumar esta fuente"))

          md = [f"# Candidatos de musica libre de derechos — \"{busqueda}\"\n",
                f"_Generado desde GitHub Actions el {time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime())}._\n",
                "\nOJO: esto es investigacion, NO una descarga ni un compromiso de uso. "
                "Cada resultado trae su licencia -- verificarla antes de bajar y agregar "
                "un track a `fabrica/musica/biblioteca.json` (ver fabrica/musica/README.md).\n"]
          for titulo, items, err in secciones:
              md.append(f"\n## {titulo}\n")
              if err:
                  md.append(f"_No se pudo consultar: {err}_\n")
              elif not items:
                  md.append("_Sin resultados._\n")
              else:
                  for it in items[:12]:
                      partes = [f"**{it.get('titulo','?')}**"]
                      if it.get("artista"):
                          partes.append(f"— {it['artista']}")
                      if it.get("duracion_s"):
                          partes.append(f"({it['duracion_s']}s)")
                      linea = " ".join(partes)
                      if it.get("url"):
                          linea = f"[{linea}]({it['url']})"
                      linea += f" — licencia: {it.get('licencia','?')}"
                      md.append(f"- {linea}")

          Path("fabrica/musica/CANDIDATOS.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          print("Escrito fabrica/musica/CANDIDATOS.md")
          PYEOF

      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain fabrica/musica/CANDIDATOS.md)" ]; then
            git add fabrica/musica/CANDIDATOS.md
            git commit -m "Candidatos de musica libre de derechos: ${{ inputs.busqueda }}"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios."
          fi
