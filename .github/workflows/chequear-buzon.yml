name: chequear-buzon

# Chequeo diario: marca como "vencido" un contenido avisado hace más de
# 3 días que nunca se confirmó subido (el artifact de GitHub Actions
# expira a esos 3 días, retention-days). Simplificado 2026-09-14
# (segunda vez, mismo día): desde que TikTok/YouTube se publican
# SIEMPRE a mano vía apps nativas, subir_video.ts/subir_carrusel.ts
# entregan el aviso de inmediato al terminar -- ya no hace falta
# "esperar a que entre en ventana" para programar nada, así que este
# chequeo diario solo hace la limpieza de vencidos.

permissions:
  contents: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"

env:
  # El cron de "schedule" siempre corre contra la rama por defecto
  # (main), pero el codigo y los datos reales viven en esta rama de
  # trabajo hasta que se mergean.
  RAMA_TRABAJO: claude/organize-repo-duplicates-xl042t

jobs:
  chequear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMA_TRABAJO }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Marcar vencidos
        working-directory: fabrica
        run: npx tsx subida/chequear_buzon.ts

      - name: Regenerar panel (panel/torre-de-control.html)
        working-directory: fabrica
        env:
          MARCAR_SUBIDO_SECRET: ${{ secrets.MARCAR_SUBIDO_SECRET }}
        run: npx tsx subida/generar_panel.ts

      - name: Commitear cambios (state/uploads.json + state/carruseles.json + panel)
        continue-on-error: true
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add state/uploads.json state/carruseles.json panel/torre-de-control.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "chequear-buzon: marcar vencidos"
          for i in 1 2 3 4 5 6; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase origin "$RAMA_TRABAJO" && \
            git push origin HEAD:"$RAMA_TRABAJO" && exit 0
            sleep $((RANDOM % 5 + 2 * i))
          done
          git rebase --abort >/dev/null 2>&1 || true
          echo "::warning::No se pudo commitear tras varios intentos (carrera de git), se reintenta la proxima corrida."
          exit 0

      - name: Sincronizar panel + estado a main (Netlify sirve el panel publico desde ahi)
        # OJO real (2026-09-15): sin este paso el panel/torre-de-control.html
        # que ve el operador en Netlify quedaba vacio/desactualizado para
        # siempre -- el resto del codigo vive en la rama de trabajo, pero
        # esto SI tiene que llegar a main (mismo patron que ya usa
        # netlify/functions/marcar-subido.js).
        continue-on-error: true
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git fetch origin main
          for i in 1 2 3 4 5 6; do
            git checkout -B sync-main origin/main
            git checkout "$RAMA_TRABAJO" -- panel/torre-de-control.html state/uploads.json state/carruseles.json
            git add panel/torre-de-control.html state/uploads.json state/carruseles.json
            if git diff --cached --quiet; then echo "sin cambios para main"; git checkout "$RAMA_TRABAJO"; exit 0; fi
            git commit -m "panel + estado: sync desde $RAMA_TRABAJO (chequear-buzon)"
            if git push origin sync-main:main; then git checkout "$RAMA_TRABAJO"; exit 0; fi
            git checkout "$RAMA_TRABAJO"
            git fetch origin main
            sleep $((RANDOM % 5 + 2 * i))
          done
          echo "::warning::No se pudo sincronizar panel/estado a main tras varios intentos (carrera de git) -- se reintenta la proxima corrida."
          exit 0
