name: probar-lectura-presign-zernio

# Diagnostico mas profundo del bug de presign de Zernio (missingFiles:1):
# despues del PUT, intenta LEER el objeto de vuelta con un GET simple
# (subida/probar_lectura_presign.ts). Nunca se habia probado este paso.
# NO llama a crearPost() -- no publica ni programa nada real, cero costo.

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Probar lectura post-presign con v07.mp4 (8.4MB)
        working-directory: fabrica
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: npx tsx subida/probar_lectura_presign.ts ../videos/remotion/v07.mp4
