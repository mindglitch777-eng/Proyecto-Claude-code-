name: render-carrusel-prueba-musk

# Carrusel de PRUEBA (pedido del operador antes del lote de 42):
# "El sistema de Elon Musk", 6 slides, con foto real (Wikimedia
# Commons/Wikidata, ver assets/personas/elon-musk/CREDITOS.md).
# Genera los 6 props JSON con generar_carrusel_prueba_musk.ts y
# renderiza cada slide como imagen fija (`npx remotion still`, no
# `render` -- un carrusel es estatico).

permissions:
  contents: write

on:
  push:
    branches: ["claude/organize-repo-duplicates-xl042t"]
    paths: [".github/workflows/render-carrusel-prueba-musk.yml"]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ver si la foto real ya existe
        id: check
        run: |
          if [ -f "assets/personas/elon-musk/00.jpg" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "AVISO: assets/personas/elon-musk/00.jpg todavia no existe -- correr foto-persona.yml primero."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.listo == 'true'
        with:
          python-version: "3.11"

      - name: Bajar foto representativa de cohete (Pexels) si falta
        if: steps.check.outputs.listo == 'true'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ ! -d "assets/metraje/cohete-lanzamiento" ] || [ -z "$(ls -A assets/metraje/cohete-lanzamiento/*.jpg 2>/dev/null)" ]; then
            python3 descargar_metraje.py cohete-lanzamiento 3
          else
            echo "Ya existe, salteo."
          fi

      - name: Bajar logo real de SpaceX (Wikidata/Commons) si falta
        if: steps.check.outputs.listo == 'true'
        run: |
          if [ -z "$(ls -A assets/logos/spacex/logo.* 2>/dev/null)" ]; then
            python3 descargar_logo_empresa.py "SpaceX" spacex
          else
            echo "Ya existe, salteo."
          fi

      - name: Commitear los assets nuevos (foto de cohete + logo)
        if: steps.check.outputs.listo == 'true'
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain assets/metraje/cohete-lanzamiento assets/logos)" ]; then
            git add assets/metraje/cohete-lanzamiento assets/logos
            git commit -m "Assets reales: foto de cohete (Pexels) + logo de SpaceX (Wikidata/Commons)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin assets nuevos."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.listo == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-spike/package-lock.json

      - name: Dependencias (remotion-spike + fabrica)
        if: steps.check.outputs.listo == 'true'
        run: |
          cd remotion-spike && npm ci --no-audit --no-fund
          cd ../fabrica && npm ci --no-audit --no-fund

      - name: Navegador para Remotion
        if: steps.check.outputs.listo == 'true'
        working-directory: remotion-spike
        run: npx remotion browser ensure

      - name: Armar public/ (fuentes, fotos, metraje, sfx)
        if: steps.check.outputs.listo == 'true'
        run: ./remotion-spike/preparar-public.sh

      - name: Exportar los props de los 6 slides
        if: steps.check.outputs.listo == 'true'
        run: |
          cd fabrica && npx tsx ejemplos/generar_carrusel_prueba_musk.ts

      - name: Renderizar los 6 slides (stills)
        if: steps.check.outputs.listo == 'true'
        working-directory: remotion-spike
        run: |
          mkdir -p out/carrusel-prueba-musk
          for f in props_carrusel/prueba-musk/slide-*.json; do
            base=$(basename "$f" .json)
            npx remotion still carrusel-slide "out/carrusel-prueba-musk/${base}.png" --props="$f" --log=info
          done

      - name: Commitear los 6 PNG
        if: steps.check.outputs.listo == 'true'
        run: |
          mkdir -p imagenes/carrusel-prueba-musk
          cp remotion-spike/out/carrusel-prueba-musk/*.png imagenes/carrusel-prueba-musk/
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add imagenes/carrusel-prueba-musk/
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Carrusel de prueba: El sistema de Elon Musk (6 slides, foto real con credito)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "reintento $i"
            sleep $((RANDOM % 8 + 2 * i))
          done
          exit 1
