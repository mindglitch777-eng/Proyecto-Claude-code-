name: subir-video

# Entrega UN video del lote21 al operador para que lo suba a mano vía
# TikTok Studio / YouTube Studio (fabrica/subida/subir_video.ts) --
# arquitectura 2026-09-14: ya no publica nada vía Zernio, solo arma y
# manda el aviso con el paquete completo (video + tema + horario
# sugerido + descripción + hashtags + música).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Id del video a entregar (ej: v01)"
        required: true
      scheduledFor:
        description: "Opcional -- ISO UTC, horario SUGERIDO (franja 18-23 ART TikTok). Vos programás la hora real en la app."
        required: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Entregar ${{ github.event.inputs.video }}
        id: subir
        working-directory: fabrica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npx tsx subida/subir_video.ts "${{ github.event.inputs.video }}" "${{ github.event.inputs.scheduledFor }}"

      - name: Subir el video como artifact (para que el link del aviso funcione)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: ${{ steps.subir.outputs.rutaVideoBuzon }}
          retention-days: 3

      - name: Regenerar panel (panel/torre-de-control.html)
        working-directory: fabrica
        run: npx tsx subida/generar_panel.ts

      - name: Commitear log de entrega + panel (state/uploads.json, panel/torre-de-control.html)
        # OJO real: con varios workflows disparados casi a la vez esto
        # puede perder la carrera de git -- el aviso por ntfy.sh ya
        # salio bien en ese caso, un fallo aca no debe tumbar el job.
        continue-on-error: true
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add state/uploads.json panel/torre-de-control.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Log de entrega + panel: ${{ github.event.inputs.video }}"
          for i in 1 2 3 4 5 6; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 5 + 2 * i))
          done
          git rebase --abort >/dev/null 2>&1 || true
          echo "::warning::No se pudo commitear state/uploads.json tras varios intentos (carrera de git) -- el aviso SI se mando bien, revisar/reconstruir el log a mano."
          exit 0
