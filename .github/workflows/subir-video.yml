name: subir-video

# Sube UN video del lote21 a TikTok + YouTube via Zernio
# (fabrica/subida/subir_video.ts). Disparo MANUAL por ahora
# (workflow_dispatch) a proposito -- primera vez que se ejercita esto
# de punta a punta con una cuenta real, no se automatiza solo hasta
# confirmar que un video de prueba aparece bien en las dos plataformas.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Id del video a subir (ej: v01)"
        required: true
      scheduledFor:
        description: "Opcional -- ISO UTC para programar (ej: 2026-09-11T00:15:00Z). Vacio = publica ya."
        required: false
      soloTiktok:
        description: "true = reintentar SOLO TikTok (no duplicar en YouTube si ya publico bien la primera vez)"
        required: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Subir ${{ github.event.inputs.video }}
        working-directory: fabrica
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: >-
          npx tsx subida/subir_video.ts "${{ github.event.inputs.video }}" "${{ github.event.inputs.scheduledFor }}"
          ${{ github.event.inputs.soloTiktok == 'true' && '--solo-tiktok' || '' }}

      - name: Commitear log de subida (state/uploads.json)
        # OJO real: con varios workflows disparados casi a la vez (ej. un
        # lote programado con scheduledFor), esto puede perder la carrera
        # de git -- el POST a Zernio del paso de arriba ya salio bien en
        # ese caso, asi que un fallo aca NO debe tumbar el job entero
        # (continue-on-error) ni esconder que la subida real funciono.
        continue-on-error: true
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add state/uploads.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Log de subida: ${{ github.event.inputs.video }}"
          for i in 1 2 3 4 5 6; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 5 + 2 * i))
          done
          git rebase --abort >/dev/null 2>&1 || true
          echo "::warning::No se pudo commitear state/uploads.json tras varios intentos (carrera de git) -- la subida real a Zernio SI salio bien, revisar/reconstruir el log a mano."
          exit 0
