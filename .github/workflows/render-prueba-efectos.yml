name: render-prueba-efectos

# Renderiza 'prueba-efectos-nuevos' (guion de prueba de los efectos
# nuevos, remotion-spike/src/fabrica_bridge/prueba-efectos-nuevos.json)
# -- mismo patron que render-lote-ventas.yml, un solo video en vez de
# una matriz de 10.

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/organize-repo-duplicates-xl042t"]
    paths:
      - "remotion-spike/RENDER_PRUEBA_EFECTOS"
      - ".github/workflows/render-prueba-efectos.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-spike/package-lock.json

      - name: Dependencias
        working-directory: remotion-spike
        run: npm ci --no-audit --no-fund

      - name: Navegador para Remotion
        working-directory: remotion-spike
        run: npx remotion browser ensure

      - name: Armar public/ (fuentes, fotos, metraje, SFX de golpes)
        run: ./remotion-spike/preparar-public.sh

      - name: Copiar audio real de la prueba de efectos a public/
        run: |
          mkdir -p remotion-spike/public/fabrica_prueba_efectos
          cp capturas_voz/audio_prueba_efectos/*.wav remotion-spike/public/fabrica_prueba_efectos/

      - name: Renderizar prueba-efectos-nuevos
        working-directory: remotion-spike
        run: |
          mkdir -p out
          npx remotion render prueba-efectos-nuevos out/prueba-efectos-nuevos.mp4 \
            --concurrency=2 --log=info

      - name: Commitear el video
        run: |
          mkdir -p videos/pruebas
          cp remotion-spike/out/prueba-efectos-nuevos.mp4 videos/pruebas/
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add videos/pruebas/prueba-efectos-nuevos.mp4
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Video de prueba: efectos nuevos (punch-in, split-screen, kinetic-text, tap-to-cut)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "reintento $i"
            sleep $((RANDOM % 8 + 2 * i))
          done
          exit 1
