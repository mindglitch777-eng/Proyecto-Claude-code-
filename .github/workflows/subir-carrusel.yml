name: subir-carrusel

# Entrega UN carrusel del lote42 al operador para que lo suba a mano
# vía TikTok Studio (fabrica/subida/subir_carrusel.ts) -- arquitectura
# 2026-09-14: ya no publica nada vía Zernio, solo arma y manda el
# aviso con el paquete completo (imágenes + tema + horario sugerido +
# descripción + hashtags + música).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      carrusel:
        description: "Id del carrusel a entregar (ej: carrusel-01)"
        required: true
      scheduledFor:
        description: "Opcional -- ISO UTC, horario SUGERIDO (franja 18-23 ART). Vos programás la hora real en TikTok Studio."
        required: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Entregar ${{ github.event.inputs.carrusel }}
        id: subir
        working-directory: fabrica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npx tsx subida/subir_carrusel.ts "${{ github.event.inputs.carrusel }}" "${{ github.event.inputs.scheduledFor }}"

      - name: Subir las imágenes como artifact (para que el link del aviso funcione)
        uses: actions/upload-artifact@v4
        with:
          name: carrusel
          path: ${{ steps.subir.outputs.carpetaImagenesBuzon }}
          retention-days: 3

      - name: Commitear log de entrega + panel (state/carruseles.json, panel/torre-de-control.html)
        # Cada intento parte de la version MAS FRESCA del remoto (fetch +
        # reset --hard) y reaplica ahi el UNICO pendiente de esta corrida
        # (state/pendientes/<id>.json, no trackeado en git -- sobrevive al
        # reset --hard) de forma idempotente -- asi nunca compite por las
        # mismas lineas que otra corrida concurrente pueda haber tocado
        # mientras tanto. Ver aplicar_pendiente.ts para el porque: el
        # patron viejo (escribir el log completo una vez y solo reintentar
        # el mismo push) perdia la carrera de git de verdad (2026-09-15:
        # 28 de 32 avisos se mandaron bien pero el registro se perdio).
        continue-on-error: true
        env:
          ID: ${{ github.event.inputs.carrusel }}
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          PENDIENTE="$GITHUB_WORKSPACE/state/pendientes/$ID.json"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            (cd fabrica && npx tsx subida/aplicar_pendiente.ts "$PENDIENTE" "$GITHUB_WORKSPACE/state/carruseles.json")
            (cd fabrica && npx tsx subida/generar_panel.ts)
            git add state/carruseles.json panel/torre-de-control.html panel/index.html
            if git diff --cached --quiet; then echo "sin cambios"; rm -f "$PENDIENTE"; exit 0; fi
            git commit -m "Log de entrega + panel: $ID"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then rm -f "$PENDIENTE"; exit 0; fi
            sleep $((RANDOM % 5 + 2 * i))
          done
          echo "::warning::No se pudo commitear state/carruseles.json tras varios intentos -- el aviso SI se mando bien, $PENDIENTE queda en el runner (se pierde al terminar el job), revisar/reconstruir el log a mano."
          exit 0

      - name: Sincronizar panel + estado a main (Netlify sirve el panel publico desde ahi)
        # OJO real (2026-09-15): sin este paso el panel/torre-de-control.html
        # que ve el operador en Netlify quedaba vacio/desactualizado para
        # siempre -- el resto del codigo vive en la rama de trabajo, pero
        # esto SI tiene que llegar a main (mismo patron que ya usa
        # netlify/functions/marcar-subido.js).
        continue-on-error: true
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          RAMA_ORIGEN="$GITHUB_REF_NAME"
          git fetch origin main
          for i in 1 2 3 4 5 6; do
            git checkout -B sync-main origin/main
            git checkout "$RAMA_ORIGEN" -- panel/torre-de-control.html panel/index.html state/uploads.json state/carruseles.json
            git add panel/torre-de-control.html panel/index.html state/uploads.json state/carruseles.json
            if git diff --cached --quiet; then echo "sin cambios para main"; git checkout "$RAMA_ORIGEN"; exit 0; fi
            git commit -m "panel + estado: sync desde $RAMA_ORIGEN (${{ github.event.inputs.carrusel }})"
            if git push origin sync-main:main; then git checkout "$RAMA_ORIGEN"; exit 0; fi
            git checkout "$RAMA_ORIGEN"
            git fetch origin main
            sleep $((RANDOM % 5 + 2 * i))
          done
          echo "::warning::No se pudo sincronizar panel/estado a main tras varios intentos (carrera de git) -- se reintenta la proxima corrida."
          exit 0
