name: subir-carrusel

# Entrega UN carrusel del lote42 al operador para que lo suba a mano
# vía TikTok Studio (fabrica/subida/subir_carrusel.ts) -- arquitectura
# 2026-09-14: ya no publica nada vía Zernio, solo arma y manda el
# aviso con el paquete completo (imágenes + tema + horario sugerido +
# descripción + hashtags + música).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      carrusel:
        description: "Id del carrusel a entregar (ej: carrusel-01)"
        required: true
      scheduledFor:
        description: "Opcional -- ISO UTC, horario SUGERIDO (franja 18-23 ART). Vos programás la hora real en TikTok Studio."
        required: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Entregar ${{ github.event.inputs.carrusel }}
        id: subir
        working-directory: fabrica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npx tsx subida/subir_carrusel.ts "${{ github.event.inputs.carrusel }}" "${{ github.event.inputs.scheduledFor }}"

      - name: Subir las imágenes como artifact (para que el link del aviso funcione)
        uses: actions/upload-artifact@v4
        with:
          name: carrusel
          path: ${{ steps.subir.outputs.carpetaImagenesBuzon }}
          retention-days: 3

      - name: Regenerar panel (panel/torre-de-control.html)
        working-directory: fabrica
        run: npx tsx subida/generar_panel.ts

      - name: Commitear log de entrega + panel (state/carruseles.json, panel/torre-de-control.html)
        continue-on-error: true
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add state/carruseles.json panel/torre-de-control.html
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Log de entrega + panel: ${{ github.event.inputs.carrusel }}"
          for i in 1 2 3 4 5 6; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 5 + 2 * i))
          done
          git rebase --abort >/dev/null 2>&1 || true
          echo "::warning::No se pudo commitear state/carruseles.json tras varios intentos (carrera de git) -- el aviso SI se mando bien, revisar/reconstruir el log a mano."
          exit 0
