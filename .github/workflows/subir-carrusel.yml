name: subir-carrusel

# Sube UN carrusel del lote42 a TikTok via Zernio
# (fabrica/subida/subir_carrusel.ts). Disparo MANUAL (workflow_dispatch)
# -- primera vez que se ejercita el posteo de fotos/carruseles, mismo
# criterio que subir-video.yml: no se automatiza solo hasta confirmar
# que aparece bien en la cuenta real.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      carrusel:
        description: "Id del carrusel a subir (ej: carrusel-01)"
        required: true
      scheduledFor:
        description: "Opcional -- ISO UTC para programar (ej: 2026-09-11T00:15:00Z). Vacio = publica ya."
        required: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Subir ${{ github.event.inputs.carrusel }}
        working-directory: fabrica
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: npx tsx subida/subir_carrusel.ts "${{ github.event.inputs.carrusel }}" "${{ github.event.inputs.scheduledFor }}"

      - name: Commitear log de subida (state/carruseles.json)
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add state/carruseles.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Log de subida: ${{ github.event.inputs.carrusel }}"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 5 + 2 * i))
          done
          exit 1
