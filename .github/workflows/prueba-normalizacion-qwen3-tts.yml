name: prueba-normalizacion-qwen3-tts

# Prueba real pedida explicitamente por el operador (ronda de trabajo
# autonoma, item 6): generar audio real con Qwen3-TTS para un lote de
# frases que cubre numeros, dolares, porcentajes, fechas, cantidades
# grandes, nombres propios, pausas y (variando instruct/rate por
# corrida) distintas intensidades -- para poder ESCUCHAR (una persona,
# no este workflow) como suena la pronunciacion real y MEDIR la
# duracion real contra la estimada.
#
# El manifest (capturas_voz/manifest_prueba_normalizacion.json) ya
# viene armado por fabrica/voz/preparar_prueba_qwen.py: cada frase ya
# paso por el normalizador real de la fabrica (fabrica/voz/
# normalizador.py), asi que el texto que llega aca es EXACTAMENTE lo
# que la fabrica nueva mandaria a produccion, no una frase de prueba
# inventada aparte.
#
# Usa la MISMA configuracion de produccion que
# generar_voz_documental_qwen.py: modelo Base 1.7B (unico que soporta
# --instruct), voz de referencia librivox-11 (LibriVox, dominio
# publico, ya aprobada e investigada ANTES de esta sesion), mismo
# --instruct y --rate 1.25 -- para que esto mida lo que de verdad va a
# sonar en un video real, no una configuracion generica.
#
# Corre en GitHub Actions (necesita bajar el modelo desde
# huggingface.co, bloqueado en el entorno de Claude Code).

on:
  workflow_dispatch:
    inputs:
      variante_intensidad:
        description: "Variante de --instruct/--rate para el item de intensidad (no cambia el texto, solo tono/velocidad)"
        required: false
        default: "produccion"
        type: choice
        options: ["produccion", "calmo", "urgente"]

permissions:
  contents: write

jobs:
  qwen3tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clonar y compilar el motor C
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev ffmpeg
          git clone --depth 1 https://github.com/gabriele-mastrapasqua/qwen3-tts /tmp/qwen3-tts
          cd /tmp/qwen3-tts
          make blas

      - name: Descargar el modelo Base 1.7B (el que soporta --ref-audio + --instruct)
        run: |
          cd /tmp/qwen3-tts
          ./download_model.sh --model base-large --dir /tmp/qwen3-tts-modelo

      - name: Preparar el audio de referencia (voz real de produccion, librivox-11)
        run: |
          ffmpeg -y -loglevel error -i \
            "muestras_voz/referencias-candidatas/librivox-11.mp3" \
            -ar 24000 -ac 1 /tmp/referencia.wav

      - name: Generar audio real para cada frase del manifest de normalizacion
        env:
          VARIANTE: ${{ inputs.variante_intensidad || 'produccion' }}
        run: |
          mkdir -p muestras_voz/prueba_normalizacion
          cd /tmp/qwen3-tts

          case "$VARIANTE" in
            calmo)
              INSTRUCT="Speak in a slow, calm, soft and relaxed tone, low energy, almost whispering"
              RATE="0.9"
              ;;
            urgente)
              INSTRUCT="Speak with urgency and high energy, fast-paced, intense, like breaking news"
              RATE="1.4"
              ;;
            *)
              # Misma config que generar_voz_documental_qwen.py (produccion real)
              INSTRUCT="Speak in a serious, elegant, composed and confident tone, clear and articulate -- not aggressive, not menacing, not overly deep"
              RATE="1.25"
              ;;
          esac
          echo "Variante: $VARIANTE (instruct=\"$INSTRUCT\", rate=$RATE)"

          python3 -c "
          import json
          m = json.load(open('$GITHUB_WORKSPACE/capturas_voz/manifest_prueba_normalizacion.json', encoding='utf-8'))
          for item in m:
              print(f\"{item['index']}\t{item['id']}\t{item['texto']}\")
          " > /tmp/lineas.tsv

          while IFS=$'\t' read -r idx id texto; do
            echo "=== [$idx] $id ==="
            nombre="$(printf '%02d' "$idx")_${id}"
            ./qwen_tts -d /tmp/qwen3-tts-modelo --ref-audio /tmp/referencia.wav \
              --text "$texto" --language Spanish \
              --instruct "$INSTRUCT" --rate "$RATE" \
              -o "/tmp/prueba-$nombre.wav" || echo "AVISO: $nombre fallo"
            if [ -f "/tmp/prueba-$nombre.wav" ]; then
              duracion_real=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/prueba-$nombre.wav")
              echo "  duracion real: ${duracion_real}s"
              ffmpeg -y -loglevel error -i "/tmp/prueba-$nombre.wav" -b:a 128k \
                "$GITHUB_WORKSPACE/muestras_voz/prueba_normalizacion/${VARIANTE}-${nombre}.mp3"
            fi
          done < /tmp/lineas.tsv

      - name: Realzar con la cadena de voz_piper.py
        run: |
          pip install --quiet numpy
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from voz_piper import realzar
          import subprocess
          for wav in Path('/tmp').glob('prueba-*.wav'):
              nombre = wav.stem.replace('prueba-', '')
              realzado = Path(f'/tmp/{nombre}-realzado.wav')
              if realzar(wav, realzado, semitonos=0):
                  mp3 = Path(f'muestras_voz/prueba_normalizacion/${{ inputs.variante_intensidad }}-{nombre}-REALZADA.mp3')
                  subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', str(realzado),
                                  '-b:a', '128k', str(mp3)])
          "

      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain muestras_voz)" ]; then
            git add muestras_voz
            git commit -m "Prueba de normalizacion Qwen3-TTS: variante ${{ inputs.variante_intensidad || 'produccion' }}"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios."
          fi
