name: foto-persona

# Baja fotos reales de personas publicas (Wikidata / Wikimedia Commons
# / Openverse -- ver buscar_foto.py) para los videos documentales,
# totalmente automatico y sin revision manual candidato por candidato:
# si no hay un resultado confiable, la persona queda sin foto (el
# video sigue con B-roll generico o fondo limpio) en vez de arriesgar
# la cara equivocada.
#
# Corre en un runner y no en la sesion de Claude Code porque ese
# entorno tiene bloqueado el acceso general a internet (se probo:
# Wikipedia da EGRESS_BLOCKED igual que Pexels y HuggingFace).
#
# Dos modos:
#   - Lote: escribir assets/personas/pedido-lote.json (una lista
#     entera de personas) y empujar -- baja todas las que falten en
#     una sola corrida. Es el modo pensado para una tanda de videos
#     nueva.
#   - Suelto: un pedido puntual, por PEDIDO.json o por el formulario
#     de workflow_dispatch (solo funciona por UI/API una vez que este
#     archivo ya este en la rama por defecto).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre y apellido (dejar vacio si se usa pedido-lote.json)"
        required: false
      slug:
        description: "Carpeta destino en assets/personas/<slug>/"
        required: false
      consulta:
        description: "Busqueda con contexto extra, para nombres comunes (ej. 'Becky Beach blogger')"
        required: false
      pista:
        description: "Palabra para desambiguar en Wikidata (ej. 'blogger', 'youtuber')"
        required: false
  push:
    paths:
      - "assets/personas/PEDIDO.json"
      - "assets/personas/pedido-lote.json"

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lote (pedido-lote.json)
        if: hashFiles('assets/personas/pedido-lote.json') != ''
        run: python3 descargar_fotos_lote.py

      - name: Pedido suelto (PEDIDO.json o formulario)
        if: hashFiles('assets/personas/pedido-lote.json') == ''
        run: |
          if [ -f assets/personas/PEDIDO.json ]; then
            nombre=$(python3 -c "import json;print(json.load(open('assets/personas/PEDIDO.json'))['nombre'])")
            slug=$(python3 -c "import json;print(json.load(open('assets/personas/PEDIDO.json'))['slug'])")
            consulta=$(python3 -c "import json;print(json.load(open('assets/personas/PEDIDO.json')).get('consulta',''))")
            pista=$(python3 -c "import json;print(json.load(open('assets/personas/PEDIDO.json')).get('pista',''))")
          else
            nombre="${{ inputs.nombre }}"
            slug="${{ inputs.slug }}"
            consulta="${{ inputs.consulta }}"
            pista="${{ inputs.pista }}"
          fi
          python3 descargar_foto_persona.py "$nombre" "$slug" "$consulta" "$pista"

      - name: Commitear
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain assets/personas/)" ]; then
            git add assets/personas/
            git commit -m "Fotos reales: actualizacion automatica"
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin foto nueva."
          fi
