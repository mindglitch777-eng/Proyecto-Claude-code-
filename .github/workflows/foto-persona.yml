name: foto-persona

# Baja UNA foto real de una persona publica (con nombre y apellido)
# desde Wikimedia Commons, para los videos documentales -- casos
# reales, a diferencia del metraje generico de Pexels que usan los
# guiones ilustrativos.
#
# Corre en un runner y no en la sesion de Claude Code porque ese
# entorno tiene bloqueado el acceso general a internet (se probo:
# Wikipedia da EGRESS_BLOCKED igual que Pexels y HuggingFace).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre y apellido tal cual buscarlo en Wikimedia Commons"
        required: true
      slug:
        description: "Carpeta destino en assets/personas/<slug>/"
        required: true
  # workflow_dispatch solo se puede disparar por API/UI si el archivo
  # ya esta en la rama por defecto. Mientras esto vive en una rama de
  # trabajo, se dispara escribiendo PEDIDO.json y empujando -- mismo
  # truco que remotion-diez.yml con su archivo RENDER.
  push:
    paths:
      - "assets/personas/PEDIDO.json"

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Leer el pedido
        id: pedido
        run: |
          if [ -f assets/personas/PEDIDO.json ]; then
            echo "nombre=$(python3 -c "import json;print(json.load(open('assets/personas/PEDIDO.json'))['nombre'])")" >> "$GITHUB_OUTPUT"
            echo "slug=$(python3 -c "import json;print(json.load(open('assets/personas/PEDIDO.json'))['slug'])")" >> "$GITHUB_OUTPUT"
          else
            echo "nombre=${{ inputs.nombre }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ inputs.slug }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bajar foto
        run: python3 descargar_foto_persona.py "${{ steps.pedido.outputs.nombre }}" "${{ steps.pedido.outputs.slug }}"

      - name: Commitear
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain assets/personas/)" ]; then
            git add assets/personas/
            git commit -m "Foto real: ${{ inputs.nombre }}"
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin foto nueva."
          fi
