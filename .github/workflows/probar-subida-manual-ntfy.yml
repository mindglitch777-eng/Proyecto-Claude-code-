name: probar-subida-manual-ntfy

# Prueba real de la tercera alternativa al bug de presign de Zernio (ver
# ESTADO.md 2026-09-14): manda un video real + su caption al celular del
# operador via ntfy.sh (subida/enviar_para_subida_manual.ts), para
# subida manual a mano en la app nativa de TikTok/YouTube -- sin pasar
# por Zernio para nada. No publica ni programa nada real.

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Subir el video como artifact (para bajarlo a mano, sin depender de ntfy)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: videos/remotion/v07.mp4
          retention-days: 3

      - name: Mandar aviso con el link para bajar el video
        working-directory: fabrica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Bloque literal (run: |), no scalar en una sola linea -- el
        # caption de prueba tiene un "#" y eso arranca un comentario YAML
        # si va en una linea plana sin comillas de bloque, cortando el
        # resto del texto en silencio (encontrado real al registrar este
        # workflow: GitHub lo aceptaba pero sin trigger workflow_dispatch
        # reconocido).
        run: |
          npx tsx subida/enviar_para_subida_manual.ts ../videos/remotion/v07.mp4 "Prueba real: tema del video de ejemplo" "hoy a las 18:00" "Prueba real: este es el aviso con el link al artifact, ya no el archivo pegado a la notificacion. #test"
