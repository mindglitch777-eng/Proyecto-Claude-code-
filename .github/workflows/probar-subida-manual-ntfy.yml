name: probar-subida-manual-ntfy

# Prueba real de la tercera alternativa al bug de presign de Zernio (ver
# ESTADO.md 2026-09-14): sube un video real como artifact de este mismo
# workflow y manda un aviso PROGRAMADO por ntfy.sh (entrega programada
# real, header At) con tema, horario y el link para bajarlo a mano
# (subida/enviar_para_subida_manual.ts), para subida manual desde la app
# nativa de TikTok/YouTube -- sin pasar por Zernio para nada. No publica
# ni programa nada real.

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fabrica/package-lock.json

      - name: Dependencias
        working-directory: fabrica
        run: npm ci --no-audit --no-fund

      - name: Subir el video como artifact (para bajarlo a mano, sin depender de ntfy)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: videos/remotion/v07.mp4
          retention-days: 3

      - name: Mandar aviso PROGRAMADO para 60s en el futuro (probar entrega programada de ntfy.sh)
        working-directory: fabrica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Bloque literal (run: |), no scalar en una sola linea -- el
        # caption de prueba tiene un "#" y eso arranca un comentario YAML
        # si va en una linea plana sin comillas de bloque, cortando el
        # resto del texto en silencio (encontrado real al registrar este
        # workflow: GitHub lo aceptaba pero sin trigger workflow_dispatch
        # reconocido).
        run: |
          ENTREGAR_EN=$(( $(date +%s) + 60 ))
          echo "Programando para el timestamp Unix $ENTREGAR_EN ($(date -u -d @$ENTREGAR_EN))"
          npx tsx subida/enviar_para_subida_manual.ts ../videos/remotion/v07.mp4 "Prueba real: tema del video de ejemplo" "en 60 segundos" "Prueba real de entrega programada -- si esto te llega ~60s despues de que dispare el workflow, funciona. #test" "$ENTREGAR_EN"
