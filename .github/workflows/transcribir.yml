name: transcribir

# El entorno de Claude Code tiene bloqueado huggingface.co (403 del
# proxy), asi que el modelo de transcripcion se baja aca.

# El job commitea su resultado: sin esto el token es de solo
# lectura y el push muere con 403 despues de hacer todo el trabajo.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      audio:
        description: "Ruta del audio a transcribir"
        required: false
        default: "capturas_voz/diez-miguel.mp3"
  push:
    paths:
      - "capturas_voz/*.mp3"

jobs:
  transcribir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install faster-whisper

      - name: Transcribir
        run: |
          A="${{ inputs.audio }}"
          [ -n "$A" ] || A="capturas_voz/diez-miguel.mp3"
          python3 herramientas/transcribir.py "$A" small

      - name: Commitear la transcripcion
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add capturas_voz/*.transcripcion.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Transcripcion con marcas de tiempo"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((2 ** i))
          done
          exit 1
