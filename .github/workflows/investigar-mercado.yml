name: investigar-mercado

# Analisis de mercado exhaustivo desde el runner (internet completo).
# Corre aca, no desde la sesion de Claude Code, por pedido explicito
# del operador -- ademas hotmart.com, bing.com y google estan
# bloqueados o degradados desde el entorno de la sesion.
#
# Mide DOS cosas distintas, no una:
#   1. Competencia real que existe ya (DuckDuckGo, Bing, Hotmart)
#   2. Demanda real de busqueda (Google Trends), no intuicion
#
# No mide TikTok directo: no tiene API publica sin aprobacion de
# partner y scrapearlo esta contra sus terminos. Se dice explicitamente
# en el reporte en vez de fabricar el dato.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --quiet pytrends

      - name: Investigar mercado
        run: python3 investigar_mercado.py

      - name: Guardar reporte
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain ANALISIS_MERCADO.md)" ]; then
            git add ANALISIS_MERCADO.md
            git commit -m "Analisis de mercado: demanda y competencia real"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios."
          fi
