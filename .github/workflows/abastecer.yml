name: abastecer

# Consigue de Pexels lo que cada plano DICE que necesita mostrar y
# engancha las rutas de vuelta en el guion.
#
# Va en su propio workflow y no dentro de producir-videos porque ahi
# cada guion corre en su propia maquina: con la matrix, veinte jobs
# bajarian las mismas fotos a la vez y ademas chocarian empujando los
# guiones a git. Aca se hace una vez, se commitea, y despues se rinde.

on:
  workflow_dispatch:
    inputs:
      patron:
        description: "Guiones a abastecer"
        required: false
        default: "guiones/*taller*.json"

permissions:
  contents: write

jobs:
  abastecer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Conseguir lo que pide cada plano
        env:
          PATRON: ${{ inputs.patron }}
        run: python3 abastecer_guiones.py "$PATRON"

      - name: Guardar
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain assets/biblioteca guiones)" ]; then
            git add assets/biblioteca guiones
            git commit -m "Abastecer guiones: imagenes que pide cada plano"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "Sin cambios."
          fi
