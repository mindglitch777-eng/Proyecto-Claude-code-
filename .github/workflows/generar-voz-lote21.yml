name: generar-voz-lote21

# Voz real (Qwen3-TTS) para el LOTE DE 21 videos (81 lineas,
# capturas_voz/manifest_lote21.json). Partido en 4 shards paralelos
# (indice % 4) para no correr 81 lineas secuenciales en un solo job --
# mismo patron/voz/instruct que generar-voz-pilotos.yml, que ya probo
# ser rapido (~11min para 12 lineas en un solo job).

on:
  push:
    branches: ["claude/organize-repo-duplicates-xl042t"]
    paths: [".github/workflows/generar-voz-lote21.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Clonar y compilar el motor C
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev ffmpeg
          git clone --depth 1 https://github.com/gabriele-mastrapasqua/qwen3-tts /tmp/qwen3-tts
          cd /tmp/qwen3-tts
          make blas

      - name: Descargar el modelo Base 1.7B
        run: |
          cd /tmp/qwen3-tts
          ./download_model.sh --model base-large --dir /tmp/qwen3-tts-modelo

      - name: Preparar el audio de referencia (voz real de produccion, librivox-11)
        run: |
          ffmpeg -y -loglevel error -i \
            "muestras_voz/referencias-candidatas/librivox-11.mp3" \
            -ar 24000 -ac 1 /tmp/referencia.wav

      - name: Instalar dependencias del realce (voz_piper.py)
        run: pip install --quiet numpy

      - name: Generar, realzar y guardar la porcion de este shard (commit incremental cada 4)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p capturas_voz/audio_lote21
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"

          INSTRUCT="Speak in a serious, elegant, composed and confident tone, clear and articulate -- not aggressive, not menacing, not overly deep"
          RATE="1.25"

          python3 -c "
          import json
          m = json.load(open('capturas_voz/manifest_lote21.json', encoding='utf-8'))
          for i, item in enumerate(m):
              if i % 4 == $SHARD:
                  print(f\"{item['id']}\t{item['texto']}\")
          " > /tmp/lineas.tsv

          echo \"Shard $SHARD: $(wc -l < /tmp/lineas.tsv) lineas\"

          YA_GENERADAS=0
          mapfile -t LINEAS < /tmp/lineas.tsv
          for linea in "${LINEAS[@]}"; do
            IFS=$'\t' read -r id texto <<< "$linea"
            destino="capturas_voz/audio_lote21/${id}.wav"

            if [ -f "$destino" ]; then
              echo "=== [$id] ya existe (corrida anterior), salteo ==="
              continue
            fi

            echo "=== [$id] ==="
            echo "  texto: $texto"
            (cd /tmp/qwen3-tts && ./qwen_tts -d /tmp/qwen3-tts-modelo --ref-audio /tmp/referencia.wav \
              --text "$texto" --language Spanish \
              --instruct "$INSTRUCT" --rate "$RATE" \
              -o "/tmp/lote21-$id.wav" < /dev/null) || echo "AVISO: $id fallo la generacion"

            if [ -f "/tmp/lote21-$id.wav" ]; then
              duracion_real=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/lote21-$id.wav")
              echo "  duracion real: ${duracion_real}s"

              python3 -c "
          import sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from voz_piper import realzar
          origen = Path('/tmp/lote21-$id.wav')
          destino = Path('$destino')
          if not realzar(origen, destino, semitonos=0):
              print('ERROR realzando $id, copio el crudo')
              import shutil; shutil.copy(origen, destino)
          "
              rm -f "/tmp/lote21-$id.wav"
              YA_GENERADAS=$((YA_GENERADAS + 1))
            fi

            if [ $((YA_GENERADAS % 4)) -eq 0 ] && [ "$YA_GENERADAS" -gt 0 ]; then
              if [ -n "$(git status --porcelain capturas_voz/audio_lote21)" ]; then
                git add capturas_voz/audio_lote21
                git commit -m "Voz real (Qwen3-TTS) lote21 shard $SHARD -- avance parcial ($YA_GENERADAS lineas)"
                for i in 1 2 3 4 5 6; do
                  git pull --rebase --autostash origin "$GITHUB_REF_NAME" && \
                  git push origin "HEAD:$GITHUB_REF_NAME" && break
                  echo "reintento push shard $SHARD: $i"
                  git rebase --abort || true
                  sleep $((RANDOM % 8 + 2 * i))
                done
                YA_GENERADAS=0
              fi
            fi
          done

      - name: Guardar el resto de este shard en el repo (si quedo algo sin commitear)
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain capturas_voz/audio_lote21)" ]; then
            git add capturas_voz/audio_lote21
            git commit -m "Voz real (Qwen3-TTS) lote21 shard ${{ matrix.shard }} -- resto"
            for i in 1 2 3 4 5 6; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && \
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
              echo "reintento push final shard ${{ matrix.shard }}: $i"
              git rebase --abort || true
              sleep $((RANDOM % 8 + 2 * i))
            done
            echo "AVISO: no se pudo pushear tras 6 intentos"
            exit 1
          else
            echo "Nada pendiente de commitear (todo se subio incrementalmente)."
          fi
