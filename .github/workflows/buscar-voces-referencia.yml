name: buscar-voces-referencia

# Busca candidatos de audio de referencia (voz masculina, español,
# licencia libre) en Wikimedia Commons y Archive.org/LibriVox. Corre
# aca porque ambas APIs estan bloqueadas desde el entorno de Claude
# Code.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Buscar y recortar candidatos
        run: python3 buscar_voces_referencia.py

      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain muestras_voz)" ]; then
            git add muestras_voz
            git commit -m "Candidatos de voz de referencia (Wikimedia + LibriVox)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || git rebase --abort || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios."
          fi
