name: descargar-metraje

# Baja metraje de banco desde Pexels y lo commitea.
# Corre aca y no en la sesion de Claude Code porque ese entorno tiene
# bloqueado el acceso a pexels.com; el runner si tiene internet abierto.
# La clave vive SOLO como secreto del repo (PEXELS_API_KEY), nunca en
# un archivo.

on:
  workflow_dispatch:
    inputs:
      nicho:
        description: "Nicho a bajar (barberia, unias, gimnasio, nutricion, veterinaria, dinero) o 'todos'"
        required: true
        default: "todos"
      cantidad:
        description: "Piezas por nicho"
        required: false
        default: "12"
      tipo:
        description: "foto o video"
        required: false
        default: "foto"

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # El modo video recorta y reencuadra cada clip con ffmpeg. Antes
      # este workflow solo bajaba fotos y no lo necesitaba.
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Bajar metraje
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NICHO: ${{ inputs.nicho }}
          CANTIDAD: ${{ inputs.cantidad }}
          TIPO: ${{ inputs.tipo }}
        run: |
          if [ "$TIPO" = "video" ]; then
            if [ "$NICHO" = "todos" ]; then
              python3 descargar_metraje.py --video "$CANTIDAD"
            else
              python3 descargar_metraje.py --video "$NICHO" "$CANTIDAD"
            fi
          elif [ "$NICHO" = "todos" ]; then
            python3 descargar_metraje.py --lote
          else
            python3 descargar_metraje.py "$NICHO" "$CANTIDAD"
          fi

      - name: Guardar en el repo
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain assets/)" ]; then
            git add assets/
            git commit -m "Metraje de banco: ${{ inputs.nicho }}"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "Sin cambios."
          fi
