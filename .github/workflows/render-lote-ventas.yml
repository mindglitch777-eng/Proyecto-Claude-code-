name: render-lote-ventas

# Renderiza el lote de 10 videos de venta (venta-01 a venta-10,
# remotion-spike/src/fabrica_bridge/venta_NN.json) en runners de
# GitHub -- cero tokens de Claude Code por render, mismo patron que
# remotion-diez.yml.
#
# El audio real (capturas_voz/audio_lote_ventas/*.wav, generado por
# generar-voz-lote-ventas.yml) SI esta commiteado, pero
# remotion-spike/public/ esta en .gitignore por completo -- por eso
# hace falta copiarlo a public/fabrica_venta/ antes de renderizar,
# distinto de preparar-public.sh (que arma fuentes/fotos/video/sfx
# para las piezas viejas, no toca fabrica_venta ni fabrica_demo).
#
# Cada job salta con un aviso si su venta_NN.json todavia no existe en
# el checkout (voz de ese video sin terminar de generar) -- no falla el
# resto del lote.
#
# DISPARO: workflow_dispatch solo funciona si el archivo ya esta en la
# rama por defecto; mientras esto viva en la rama de trabajo se dispara
# tocando remotion-spike/RENDER_VENTAS y empujando.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Ids separados por coma (vacio = los 10)"
        required: false
        default: ""
  push:
    paths:
      - "remotion-spike/RENDER_VENTAS"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        video: [venta-01, venta-02, venta-03, venta-04, venta-05, venta-06, venta-07, venta-08, venta-09, venta-10]
    steps:
      - uses: actions/checkout@v4

      - name: Ver si el guion de este video ya existe
        id: check
        run: |
          stem=$(echo "${{ matrix.video }}" | sed 's/venta-/venta_/')
          if [ -f "remotion-spike/src/fabrica_bridge/${stem}.json" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "AVISO: ${stem}.json todavia no existe (voz de ese video sin terminar) -- salteo este job."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.listo == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-spike/package-lock.json

      - name: Dependencias
        if: steps.check.outputs.listo == 'true'
        working-directory: remotion-spike
        run: npm ci --no-audit --no-fund

      - name: Navegador para Remotion
        if: steps.check.outputs.listo == 'true'
        working-directory: remotion-spike
        run: npx remotion browser ensure

      - name: Armar public/ (fuentes, fotos, metraje, SFX de golpes)
        if: steps.check.outputs.listo == 'true'
        run: ./remotion-spike/preparar-public.sh

      - name: Copiar audio real del lote de ventas a public/
        # preparar-public.sh arma fuentes/fotos/video/sfx/audio_documental
        # pero no sabe nada de fabrica_venta/ (no existia cuando se
        # escribio) -- por eso va DESPUES, para que el rm -rf de ese
        # script no se lleve puesto este audio.
        if: steps.check.outputs.listo == 'true'
        run: |
          mkdir -p remotion-spike/public/fabrica_venta
          cp capturas_voz/audio_lote_ventas/*.wav remotion-spike/public/fabrica_venta/

      - name: Renderizar ${{ matrix.video }}
        if: steps.check.outputs.listo == 'true'
        working-directory: remotion-spike
        run: |
          mkdir -p out
          npx remotion render ${{ matrix.video }} out/${{ matrix.video }}.mp4 \
            --concurrency=2 --log=info

      - name: Commitear ${{ matrix.video }}
        if: steps.check.outputs.listo == 'true'
        run: |
          mkdir -p videos/venta
          cp remotion-spike/out/${{ matrix.video }}.mp4 videos/venta/
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add videos/venta/${{ matrix.video }}.mp4
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Video Remotion ${{ matrix.video }} (lote de ventas)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "reintento $i"
            sleep $((RANDOM % 8 + 2 * i))
          done
          exit 1
