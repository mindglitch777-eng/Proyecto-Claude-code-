name: scrapear-post

# Primer uso real de Scrapling (D4Vinci/Scrapling en GitHub) -- lee
# publicaciones publicas (Instagram/TikTok/etc.) que el sandbox de
# Claude Code bloquea a nivel de proxy de red, pero que este runner de
# GitHub Actions si puede alcanzar (salida a internet normal). Sin
# login, sin cuenta real -- solo meta tags publicos (ver docstring de
# fabrica/research/scraper.py).

permissions:
  contents: write

on:
  push:
    branches: ["claude/organize-repo-duplicates-xl042t"]
    paths: [".github/workflows/scrapear-post.yml"]
  workflow_dispatch:
    inputs:
      url:
        description: "URL publica a scrapear"
        required: false
        default: "https://www.instagram.com/p/Dc_64UfCu5o/"

jobs:
  scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Scrapling + navegadores
        run: |
          pip install --quiet "scrapling[all]"
          scrapling install

      - name: Scrapear la URL
        id: scrapear
        env:
          URL: ${{ inputs.url || 'https://www.instagram.com/p/Dc_64UfCu5o/' }}
        run: |
          mkdir -p fabrica/research/scraped
          SLUG=$(python3 -c "
          import re, time
          u = '''$URL'''
          partes = [p for p in u.split('/') if p and 'http' not in p and '.' not in p]
          slug = partes[-1] if partes else 'post'
          slug = re.sub(r'[^a-zA-Z0-9_-]', '', slug)[:40] or 'post'
          print(f'{slug}-{int(time.time())}')
          ")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          python3 fabrica/research/scraper.py "$URL" "fabrica/research/scraped/${SLUG}.json"

      - name: Guardar el resultado en el repo
        if: always()
        run: |
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          if [ -z "$(git status --porcelain fabrica/research/scraped)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git add fabrica/research/scraped
          git commit -m "Scraping real: ${{ steps.scrapear.outputs.slug }}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && \
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "reintento push: $i"
            git rebase --abort || true
            sleep $((RANDOM % 8 + 2 * i))
          done
          echo "AVISO: no se pudo pushear tras 6 intentos"
          exit 1
