name: render-prueba-subtitulos-grandes

# Verificacion visual de SubtitulosGrandes.tsx (R7-34, reemplazo de
# GlitchShatter pedido por el operador) -- misma fixture/audio que
# prueba-captions (TikTokCaptions.tsx, R7-16). Renderiza el clip corto
# de prueba (3.52s) para inspeccionar frames antes de usarlo en un
# guion real. El sandbox local bloquea la descarga del navegador de
# Remotion (remotion.media no esta en el allowlist de red) -- por eso
# esto corre en un runner de GitHub Actions, mismo patron que el resto
# de los renders reales del proyecto.

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/organize-repo-duplicates-xl042t"]
    paths:
      - ".github/workflows/render-prueba-subtitulos-grandes.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-spike/package-lock.json

      - name: Dependencias
        working-directory: remotion-spike
        run: npm ci --no-audit --no-fund

      - name: Navegador para Remotion
        working-directory: remotion-spike
        run: npx remotion browser ensure

      - name: Armar public/ (fuentes, fotos, metraje, SFX de golpes)
        run: ./remotion-spike/preparar-public.sh

      - name: Copiar audio real de fabrica_demo_05 a public/ (no esta trackeado, ver capturas_voz/)
        run: |
          mkdir -p remotion-spike/public/fabrica_demo_05
          cp capturas_voz/audio_demo_05/hook_0.wav remotion-spike/public/fabrica_demo_05/

      - name: Renderizar prueba-subtitulos-grandes
        working-directory: remotion-spike
        run: |
          mkdir -p out
          npx remotion render prueba-subtitulos-grandes out/prueba-subtitulos-grandes.mp4 \
            --concurrency=2 --log=info

      - name: Commitear el clip de prueba (la cuota de artefactos de Actions esta llena)
        run: |
          mkdir -p videos/pruebas
          cp remotion-spike/out/prueba-subtitulos-grandes.mp4 videos/pruebas/
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add videos/pruebas/prueba-subtitulos-grandes.mp4
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Clip de prueba: SubtitulosGrandes (verificacion visual, R7-34)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "reintento $i"
            sleep $((RANDOM % 8 + 2 * i))
          done
          exit 1
