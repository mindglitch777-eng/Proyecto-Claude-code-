name: producir-videos

# Renderiza el lote completo (o el patron indicado) en runners de
# GitHub -- cero tokens de Claude Code por render. Todo el trabajo es
# Python + Pillow + ffmpeg deterministico (animador_v9.py, armar_video.py,
# sincronizar_voz.py), sin ningun modelo de IA de por medio.
#
# Paraleliza con una matrix: cada guion se renderiza en su propio
# runner al mismo tiempo (en vez de uno detras del otro en un solo
# runner), asi 27 videos tardan lo que tarda EL MAS LENTO de ellos, no
# la suma de los 27. Cada job sube su video como artifact (no pushea
# directo -- 20 jobs empujando al mismo tiempo generarian conflictos
# de git); un ultimo job junta todos los artifacts y hace un solo
# commit.
#
# Manual siempre (workflow_dispatch): nunca corre solo. Si hay audios
# de voz completos en capturas_voz/ para un guion, los usa; si no,
# renderiza igual con las duraciones del guion (sin voz real todavia).

on:
  workflow_dispatch:
    inputs:
      patron:
        description: "Patron glob de guiones a producir"
        required: false
        default: "guiones/*.json"
      solo_nuevos:
        description: "Saltear los que ya tienen video actualizado"
        required: false
        default: "false"
        type: boolean
      commit_directo:
        description: "Commitear el video directo (sin artifacts). Usar en lotes CHICOS."
        required: false
        default: false
        type: boolean

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.listar.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4

      - id: listar
        run: |
          python3 -c "
          import glob, json, os
          patron = os.environ['PATRON']
          archivos = sorted(
              f for f in glob.glob(patron)
              if not f.endswith('-con-voz.json')
          )
          print(json.dumps(archivos))
          " > /tmp/matriz.json
          echo "matriz=$(cat /tmp/matriz.json)" >> "$GITHUB_OUTPUT"
          echo "Guiones a producir: $(cat /tmp/matriz.json)"
        env:
          PATRON: ${{ inputs.patron }}

  producir:
    needs: listar
    if: needs.listar.outputs.matriz != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        guion: ${{ fromJson(needs.listar.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg y Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow

      - name: Producir este guion
        id: producir
        run: |
          FLAG=""
          if [ "${{ inputs.solo_nuevos }}" != "true" ]; then FLAG="--forzar"; fi
          python3 fabrica.py "${{ matrix.guion }}" $FLAG
          STEM=$(basename "${{ matrix.guion }}" .json)
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/salida/videos /tmp/salida/guiones
          cp "videos/$STEM.mp4" /tmp/salida/videos/ 2>/dev/null || true
          cp "guiones/$STEM-con-voz.json" /tmp/salida/guiones/ 2>/dev/null || true

      # Se sube SOLO lo que produjo este job. Subir videos/*.mp4 entero
      # incluia los 26 videos VIEJOS que vienen del checkout, y al
      # juntar los artifacts esas copias viejas se pisaban unas a otras:
      # el lote entero terminaba guardando un solo video nuevo.
      # if: always() -- si el paso anterior falla a mitad de camino pero
      # el .mp4 alcanzo a escribirse, igual se guarda. Perder un render
      # ya hecho por un error posterior nos costo dos lotes enteros.
      # Camino alternativo para lotes chicos: el job commitea su propio
      # video en vez de pasar por artifacts. Existe porque la cuota de
      # almacenamiento de artifacts se lleno y el upload empezo a fallar
      # con "Artifact storage quota has been hit" -- el video se
      # renderizaba bien y se perdia igual en el ultimo paso.
      # Solo para pocos guiones: con 27 jobs en paralelo empujando a git
      # el reintento no alcanza, y para eso siguen estando los artifacts.
      - name: Commitear video directo
        if: always() && inputs.commit_directo
        run: |
          shopt -s nullglob
          STEM="${{ steps.producir.outputs.stem }}"
          [ -z "$STEM" ] && STEM=$(basename "${{ matrix.guion }}" .json)
          [ -f "videos/$STEM.mp4" ] || { echo "No hay video para $STEM."; exit 0; }
          git config user.name  "productor-bot"
          git config user.email "actions@github.com"
          git add "videos/$STEM.mp4"
          CON_VOZ=("guiones/$STEM-con-voz.json")
          if [ ${#CON_VOZ[@]} -gt 0 ]; then git add "${CON_VOZ[@]}"; fi
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "Video: $STEM"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push fallido (intento $intento), reintento..."
            sleep $((intento * 3))
          done
          echo "No se pudo pushear el video."; exit 1

      - name: Subir resultado como artifact
        if: always() && !inputs.commit_directo
        uses: actions/upload-artifact@v4
        with:
          name: salida-${{ strategy.job-index }}
          path: /tmp/salida
          if-no-files-found: ignore
          retention-days: 1

  commitear:
    needs: producir
    if: always() && needs.listar.outputs.matriz != '[]' && !inputs.commit_directo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Descargar todos los resultados
        uses: actions/download-artifact@v4
        with:
          path: /tmp/salidas
          pattern: salida-*

      - name: Acomodar y commitear
        run: |
          shopt -s nullglob
          mkdir -p videos guiones
          for d in /tmp/salidas/salida-*/; do
            [ -d "${d}videos" ] && cp -f "${d}"videos/*.mp4 videos/ 2>/dev/null || true
            [ -d "${d}guiones" ] && cp -f "${d}"guiones/*-con-voz.json guiones/ 2>/dev/null || true
          done
          git config user.name "productor-bot"
          git config user.email "actions@github.com"
          git add videos/
          CON_VOZ=(guiones/*-con-voz.json)
          if [ ${#CON_VOZ[@]} -gt 0 ]; then git add "${CON_VOZ[@]}"; fi
          git diff --cached --quiet || git commit -m "Produccion automatica de videos (paralela)"
          git pull --rebase --autostash
          git push
